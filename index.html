<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>趣味成語數學題 ‧ 200+題動腦防老超大題庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;700;900&display=swap');
    
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #f8fafc;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .serif-font {
      font-family: 'Noto Serif TC', serif;
    }
    .slot-box {
      min-width: 3.2rem;
      height: 3.5rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-bottom: 4px solid #dc2626;
      font-weight: 900;
      color: #991b1b;
      font-size: 2rem;
      background-color: #fef2f2;
      border-radius: 0.5rem;
      transition: all 0.15s ease;
      cursor: pointer;
      margin: 0 4px;
    }
    .slot-box.active {
      background-color: #fee2e2;
      outline: 3px solid #ef4444;
      transform: scale(1.06);
    }
    .btn-key {
      touch-action: manipulation;
      transition: transform 0.08s ease, background-color 0.15s ease;
    }
    .btn-key:active {
      transform: scale(0.92);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center justify-between pb-6">

  <!-- 頂部 Header -->
  <header class="w-full max-w-2xl bg-white shadow-sm border-b border-amber-200 sticky top-0 z-30 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <span class="text-3xl">🧠</span>
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="text-xl sm:text-2xl font-black text-rose-800 tracking-wide serif-font">成語數學大闖關</h1>
          <span class="text-xs bg-red-600 text-white font-extrabold px-2 py-0.5 rounded-full">210+ 題庫</span>
        </div>
        <p class="text-xs text-amber-700 font-bold">多動腦 ‧ 人不老 ‧ 越玩越靈光</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <span class="text-sm font-black bg-rose-100 text-rose-800 px-3 py-1 rounded-full shadow-inner" id="scoreDisplay">得分: 0</span>
      <button onclick="toggleSound()" id="soundBtn" class="text-xl p-1.5 rounded-lg bg-amber-50 border border-amber-200 hover:bg-amber-100" title="語音切換">🔊</button>
    </div>
  </header>

  <!-- 主遊戲區域 -->
  <main class="w-full max-w-2xl px-4 flex-1 flex flex-col justify-center my-3 space-y-3.5">
    
    <!-- 篩選分類與題號資訊 -->
    <div class="flex flex-col gap-2.5 bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm">
      <div class="flex items-center justify-between gap-1">
        <div class="flex items-center space-x-1.5 overflow-x-auto text-sm font-bold no-scrollbar py-0.5">
          <button onclick="changeCategory('all')" id="tab-all" class="cat-tab px-3 py-1 rounded-lg bg-rose-600 text-white shadow-sm shrink-0">全部 (<span id="totalCount">210</span>)</button>
          <button onclick="changeCategory('加法')" id="tab-加法" class="cat-tab px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">加法</button>
          <button onclick="changeCategory('減法')" id="tab-減法" class="cat-tab px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">減法</button>
          <button onclick="changeCategory('乘法')" id="tab-乘法" class="cat-tab px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">乘法</button>
          <button onclick="changeCategory('除法')" id="tab-除法" class="cat-tab px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">除法</button>
          <button onclick="changeCategory('混合')" id="tab-混合" class="cat-tab px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0">混合</button>
        </div>

        <button onclick="nextRandomQuestion()" class="flex items-center space-x-1 text-sm font-bold bg-amber-500 hover:bg-amber-600 text-white px-3 py-1 rounded-lg shadow transition shrink-0">
          <span>🎲 隨機換題</span>
        </button>
      </div>

      <!-- 快速跳題與進度列 -->
      <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-xs font-bold text-slate-500">
        <div class="flex items-center space-x-2">
          <span>目前進度：</span>
          <span id="currentQIndexLabel" class="text-rose-700 font-extrabold text-sm">第 1 題</span>
          <span id="categoryRangeLabel" class="text-slate-400 font-medium"></span>
        </div>
        <div class="flex items-center space-x-1.5">
          <button onclick="prevQuestion()" class="px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700">◀ 上一題</button>
          <button onclick="nextQuestion()" class="px-2.5 py-1 rounded bg-slate-100 hover:bg-slate-200 text-slate-700">下一題 ▶</button>
        </div>
      </div>
    </div>

    <!-- 題目主卡片 -->
    <div class="bg-white rounded-2xl p-5 sm:p-7 shadow-md border-2 border-rose-100 flex flex-col items-center text-center relative overflow-hidden">
      <div id="categoryBadge" class="text-xs font-black uppercase tracking-widest text-white px-3.5 py-1 rounded-full bg-rose-500 mb-2 shadow-sm">
        加法運算
      </div>

      <!-- 核心算式容器 -->
      <div id="equationContainer" class="serif-font text-2xl sm:text-3xl md:text-4xl leading-relaxed tracking-wider font-extrabold flex flex-wrap items-center justify-center gap-2 py-3 text-slate-800 min-h-[4.8rem]">
      </div>

      <!-- 提示與反饋訊息區 -->
      <div id="feedbackMsg" class="min-h-[2.2rem] mt-1 text-base sm:text-lg font-bold flex items-center justify-center text-slate-500">
        點選空格後，在下方數字盤選字填入！
      </div>

      <!-- 數學驗證解說 -->
      <div id="mathProof" class="hidden mt-2.5 w-full bg-emerald-50 border border-emerald-300 text-emerald-900 rounded-xl p-3 text-sm sm:text-base font-bold">
      </div>
    </div>

    <!-- 數字虛擬鍵盤 -->
    <div class="bg-white rounded-2xl p-3 sm:p-4 shadow-md border border-slate-200">
      <div class="text-xs text-slate-400 font-bold mb-2 text-center">點擊文字填入括號中：</div>
      <div class="grid grid-cols-5 gap-2 max-w-md mx-auto">
        <button onclick="inputChar('一')" class="btn-key py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-2xl font-black text-amber-950 shadow-sm">一</button>
        <button onclick="inputChar('二')" class="btn-key py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-2xl font-black text-amber-950 shadow-sm">二</button>
        <button onclick="inputChar('兩')" class="btn-key py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-2xl font-black text-amber-950 shadow-sm">兩</button>
        <button onclick="inputChar('三')" class="btn-key py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-2xl font-black text-amber-950 shadow-sm">三</button>
        <button onclick="inputChar('四')" class="btn-key py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-2xl font-black text-amber-950 shadow-sm">四</button>

        <button onclick="inputChar('五')" class="btn-key py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-2xl font-black text-amber-950 shadow-sm">五</button>
        <button onclick="inputChar('六')" class="btn-key py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-2xl font-black text-amber-950 shadow-sm">六</button>
        <button onclick="inputChar('七')" class="btn-key py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-2xl font-black text-amber-950 shadow-sm">七</button>
        <button onclick="inputChar('八')" class="btn-key py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-2xl font-black text-amber-950 shadow-sm">八</button>
        <button onclick="inputChar('九')" class="btn-key py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-2xl font-black text-amber-950 shadow-sm">九</button>

        <button onclick="inputChar('十')" class="btn-key py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-2xl font-black text-amber-950 shadow-sm">十</button>
        <button onclick="inputChar('百')" class="btn-key py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-2xl font-black text-amber-950 shadow-sm">百</button>
        <button onclick="inputChar('千')" class="btn-key py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-2xl font-black text-amber-950 shadow-sm">千</button>
        <button onclick="inputChar('萬')" class="btn-key py-2.5 rounded-xl bg-amber-50 hover:bg-amber-100 border border-amber-200 text-2xl font-black text-amber-950 shadow-sm">萬</button>
        <button onclick="clearSlot()" class="btn-key py-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 border border-rose-200 text-xl font-black text-rose-700 shadow-sm">⌫ 清除</button>
      </div>
    </div>

    <!-- 控制按鈕區 -->
    <div class="grid grid-cols-3 gap-2.5">
      <button onclick="checkAnswer()" class="py-3 rounded-xl bg-rose-600 hover:bg-rose-700 text-white font-extrabold text-base sm:text-lg shadow-md transition flex items-center justify-center space-x-1">
        <span>✔️ 送出核對</span>
      </button>
      <button onclick="showAnswer()" class="py-3 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-extrabold text-base sm:text-lg transition flex items-center justify-center space-x-1">
        <span>💡 看解答</span>
      </button>
      <button onclick="nextRandomQuestion()" class="py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-base sm:text-lg shadow-md transition flex items-center justify-center space-x-1">
        <span>換下一題 ➡️</span>
      </button>
    </div>

  </main>

  <footer class="text-xs text-slate-400 text-center py-2">
    成語數學題 ‧ 210+ 超大海量題庫 ‧ 隨機抽題 ‧ 活絡記憶
  </footer>

      { cat: "除法", pattern: ["( )顧茅廬", "÷", "( )思而行", "＝", "( )手遮天"], answers: ["三", "三", "一"], math: "3 ÷ 3 ＝ 1 (一手遮天)" },
      { cat: "除法", pattern: ["( )長兩短", "÷", "( )言為定", "＝", "( )生有幸"], answers: ["三", "一", "三"], math: "3 ÷ 1 ＝ 3 (三生有幸)" },

      { cat: "混合", pattern: ["( )石", "( )鳥", "×", "退避( )舍", "＝", "( )頭", "( )臂"], answers: ["一", "二", "三", "三", "六"], math: "12 × 3 ＝ 36 (三頭六臂)" },
      { cat: "混合", pattern: ["( )面", "( )方", "÷", "獨( )無( )", "＝", "( )面楚歌"], answers: ["四", "八", "一", "二", "四"], math: "48 ÷ 12 ＝ 4 (四面楚歌)" },

      { cat: "混合", pattern: ["( )令", "( )申", "＋", "( )鳴驚人", "＝", "( )頭", "( )臂"], answers: ["三", "五", "一", "三", "六"], math: "35 ＋ 1 ＝ 36 (三頭六臂)" },
      { cat: "混合", pattern: ["( )頭", "( )臂", "－", "( )字千金", "＝", "( )令", "( )申"], answers: ["三", "六", "一", "三", "五"], math: "36 － 1 ＝ 35 (三令五申)" },

      { cat: "混合", pattern: ["獨( )無( )", "×", "( )顧茅廬", "＝", "( )頭", "( )臂"], answers: ["一", "二", "三", "三", "六"], math: "12 × 3 ＝ 36 (三頭六臂)" }
    ];

    let currentCategory = 'all';
    let currentList = [...QUESTION_BANK];
    let currentIndex = 0;
    let currentQ = null;
    let userInputs = [];
    let activeSlotIndex = 0;
    let score = 0;
    let soundEnabled = true;

    function initGame() {
      document.getElementById('totalCount').innerText = QUESTION_BANK.length;
      updateFilterList();
      loadQuestionByIndex(0);
    }

    function updateFilterList() {
      if (currentCategory === 'all') {
        currentList = [...QUESTION_BANK];
      } else {
        currentList = QUESTION_BANK.filter(q => q.cat === currentCategory);
      }
      currentIndex = 0;
    }

    function changeCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-tab').forEach(b => {
        b.className = 'cat-tab px-3 py-1 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 shrink-0';
      });
      const activeBtn = document.getElementById('tab-' + cat);
      if (activeBtn) {
        activeBtn.className = 'cat-tab px-3 py-1 rounded-lg bg-rose-600 text-white shadow-sm shrink-0';
      }
      updateFilterList();
      loadQuestionByIndex(0);
    }

    function loadQuestionByIndex(idx) {
      if (currentList.length === 0) return;
      if (idx < 0) idx = currentList.length - 1;
      if (idx >= currentList.length) idx = 0;
      currentIndex = idx;
      currentQ = currentList[currentIndex];

      userInputs = new Array(currentQ.answers.length).fill("");
      activeSlotIndex = 0;

      document.getElementById('categoryBadge').innerText = currentQ.cat + "題型";
      document.getElementById('currentQIndexLabel').innerText = `第 ${currentIndex + 1} 題`;
      document.getElementById('categoryRangeLabel').innerText = `(此類共 ${currentList.length} 題)`;

      renderEquation();

      const fb = document.getElementById('feedbackMsg');
      fb.innerText = "點選空格後，在下方數字盤選字填入！";
      fb.className = "min-h-[2.2rem] mt-1 text-base sm:text-lg font-bold flex items-center justify-center text-slate-500";

      const proof = document.getElementById('mathProof');
      proof.classList.add('hidden');
      proof.innerText = "";
    }

    function nextQuestion() {
      loadQuestionByIndex(currentIndex + 1);
    }

    function prevQuestion() {
      loadQuestionByIndex(currentIndex - 1);
    }

    function nextRandomQuestion() {
      const randIdx = Math.floor(Math.random() * currentList.length);
      loadQuestionByIndex(randIdx);
    }

    function renderEquation() {
      const container = document.getElementById('equationContainer');
      container.innerHTML = "";
      let slotCount = 0;

      currentQ.pattern.forEach(part => {
        if (part === "＋" || part === "－" || part === "×" || part === "÷") {
          const span = document.createElement('span');
          span.className = "text-amber-600 px-1 font-black";
          span.innerText = part;
          container.appendChild(span);
        } else if (part === "＝") {
          const span = document.createElement('span');
          span.className = "text-emerald-600 px-1 font-black";
          span.innerText = part;
          container.appendChild(span);
        } else if (part.includes("( )")) {
          const segs = part.split("( )");
          for (let i = 0; i < segs.length; i++) {
            if (segs[i]) {
              const textSpan = document.createElement('span');
              textSpan.innerText = segs[i];
              container.appendChild(textSpan);
            }
            if (i < segs.length - 1) {
              const slotIdx = slotCount++;
              const slot = document.createElement('div');
              slot.className = `slot-box ${slotIdx === activeSlotIndex ? 'active' : ''}`;
              slot.id = `slot-${slotIdx}`;
              slot.innerText = userInputs[slotIdx] || "";
              slot.onclick = () => selectSlot(slotIdx);
              container.appendChild(slot);
            }
          }
        } else {
          const span = document.createElement('span');
          span.innerText = part;
          container.appendChild(span);
        }
      });
    }

    function selectSlot(idx) {
      activeSlotIndex = idx;
      document.querySelectorAll('.slot-box').forEach((el, i) => {
        el.classList.toggle('active', i === idx);
      });
    }

    function inputChar(ch) {
      if (activeSlotIndex >= userInputs.length) return;
      userInputs[activeSlotIndex] = ch;
      const slot = document.getElementById(`slot-${activeSlotIndex}`);
      if (slot) slot.innerText = ch;

      if (activeSlotIndex < userInputs.length - 1) {
        selectSlot(activeSlotIndex + 1);
      }
    }

    function clearSlot() {
      userInputs[activeSlotIndex] = "";
      const slot = document.getElementById(`slot-${activeSlotIndex}`);
      if (slot) slot.innerText = "";
    }

    function checkAnswer() {
      const normalize = s => (s === '兩' ? '二' : s);

      let isCorrect = true;
      for (let i = 0; i < currentQ.answers.length; i++) {
        const expected = currentQ.answers[i];
        const entered = userInputs[i];
        if (!entered || (normalize(entered) !== normalize(expected))) {
          isCorrect = false;
          break;
        }
      }

      const fb = document.getElementById('feedbackMsg');
      const proof = document.getElementById('mathProof');

      if (isCorrect) {
        score += 10;
        document.getElementById('scoreDisplay').innerText = `得分: ${score}`;
        fb.innerText = "🎉 太厲害了！完全正確！頭腦好靈光！";
        fb.className = "min-h-[2.2rem] mt-1 text-lg sm:text-xl font-black flex items-center justify-center text-emerald-600";
        
        proof.classList.remove('hidden');
        proof.innerText = `💡 驗證邏輯：${currentQ.math}`;

        confetti({
          particleCount: 50,
          spread: 60,
          origin: { y: 0.7 }
        });

        speak("太棒了！完全正確！");
      } else {
        fb.innerText = "❌ 好像不太對喔，再檢查算式想一想！";
        fb.className = "min-h-[2.2rem] mt-1 text-base sm:text-lg font-black flex items-center justify-center text-rose-600";
        speak("再想一想喔！");
      }
    }

    function showAnswer() {
      userInputs = [...currentQ.answers];
      userInputs.forEach((ans, i) => {
        const slot = document.getElementById(`slot-${i}`);
        if (slot) slot.innerText = ans;
      });

      const fb = document.getElementById('feedbackMsg');
      fb.innerText = "💡 答案已為您公佈，動動腦記起來！";
      fb.className = "min-h-[2.2rem] mt-1 text-base sm:text-lg font-bold flex items-center justify-center text-blue-600";

      const proof = document.getElementById('mathProof');
      proof.classList.remove('hidden');
      proof.innerText = `💡 答案解析：${currentQ.math}`;

      speak("答案是：" + currentQ.answers.join("、"));
    }

    function speak(text) {
      if (!soundEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'zh-TW';
      utter.rate = 1.0;
      window.speechSynthesis.speak(utter);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('soundBtn');
      btn.innerText = soundEnabled ? '🔊' : '🔇';
    }

    window.addEventListener('keydown', (e) => {
      const numMap = {
        '1': '一', '2': '二', '3': '三', '4': '四', '5': '五',
        '6': '六', '7': '七', '8': '八', '9': '九', '0': '十'
      };
      if (numMap[e.key]) {
        inputChar(numMap[e.key]);
      } else if (e.key === 'Backspace') {
        clearSlot();
      } else if (e.key === 'Enter') {
        checkAnswer();
      } else if (e.key === 'ArrowRight') {
        nextQuestion();
      } else if (e.key === 'ArrowLeft') {
        prevQuestion();
      }
    });

    window.onload = initGame;
  </script>
